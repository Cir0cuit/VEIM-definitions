name: Mirrors

# The live sweep CI leaves out: every edition resolved against its real mirror,
# weekly, so a broken scraper shows up before a user meets it. A failure names
# the distribution, and GitHub emails the failed run to the repository owner.
# Fix it here and push: the fix reaches users at their next start.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          path: definitions

      - uses: actions/checkout@v7
        with:
          repository: Cir0cuit/VEIM
          path: veim

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install requests pytest

      - name: Resolve every edition against its mirror
        working-directory: definitions
        env:
          VEIM_SRC: ${{ github.workspace }}/veim
        run: pytest -m network -v
